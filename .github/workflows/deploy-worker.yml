name: Deploy Worker
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build frontend assets
        run: npm run build
      - name: Ensure Cloudflare resources
        id: ensure_resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/scripts/ensure-cloudflare-resources.mjs
      - name: Generate wrangler config for CI
        shell: bash
        run: |
          cp wrangler.example.toml wrangler.ci.toml
          sed -i "s|YOUR_D1_DATABASE_ID_HERE|${{ steps.ensure_resources.outputs.d1_database_id }}|g" wrangler.ci.toml
          sed -i "s|YOUR_KV_NAMESPACE_ID_HERE|${{ steps.ensure_resources.outputs.kv_namespace_id }}|g" wrangler.ci.toml
      - name: Initialize D1 schema (first creation only)
        if: steps.ensure_resources.outputs.d1_created == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute ${{ steps.ensure_resources.outputs.d1_database_name }} --remote --file worker/schema.sql --config wrangler.ci.toml
      - name: Ensure D1 reply-message schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          schema_json=$(npx wrangler d1 execute ${{ steps.ensure_resources.outputs.d1_database_name }} --remote --command "PRAGMA table_info(messages);" --json --config wrangler.ci.toml)
          if echo "$schema_json" | grep -q '"name": "reply_to_message_id"'; then
            echo "D1 reply-message schema already present."
          else
            echo "Applying D1 reply-message schema migration."
            npx wrangler d1 execute ${{ steps.ensure_resources.outputs.d1_database_name }} --remote --file worker/migrations/2026-07-29-reply-messages.sql --config wrangler.ci.toml
          fi
      - name: Ensure D1 user activity log schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          users_schema_json=$(npx wrangler d1 execute ${{ steps.ensure_resources.outputs.d1_database_name }} --remote --command "PRAGMA table_info(users);" --json --config wrangler.ci.toml)
          if echo "$users_schema_json" | grep -q '"name": "last_seen_at"'; then
            echo "D1 user last_seen_at schema already present."
          else
            echo "Applying D1 user last_seen_at schema migration."
            printf 'ALTER TABLE users ADD COLUMN last_seen_at TEXT;\n' > .tmp/edgechat-last-seen.sql
            npx wrangler d1 execute ${{ steps.ensure_resources.outputs.d1_database_name }} --remote --file .tmp/edgechat-last-seen.sql --config wrangler.ci.toml
          fi
          npx wrangler d1 execute ${{ steps.ensure_resources.outputs.d1_database_name }} --remote --file worker/migrations/2026-07-30-operation-logs-idempotent.sql --config wrangler.ci.toml

      - name: Generate admin bootstrap SQL (optional)
        env:
          EDGECHAT_ADMIN_USERNAME: ${{ secrets.EDGECHAT_ADMIN_USERNAME || secrets.CFCHAT_ADMIN_USERNAME }}
          EDGECHAT_ADMIN_PASSWORD: ${{ secrets.EDGECHAT_ADMIN_PASSWORD || secrets.CFCHAT_ADMIN_PASSWORD }}
          EDGECHAT_ADMIN_DISPLAY_NAME: ${{ secrets.EDGECHAT_ADMIN_DISPLAY_NAME || secrets.CFCHAT_ADMIN_DISPLAY_NAME }}
        shell: bash
        run: |
          if [[ -n "$EDGECHAT_ADMIN_USERNAME" && -n "$EDGECHAT_ADMIN_PASSWORD" ]]; then
            node .github/scripts/generate-admin-bootstrap-sql.mjs
          else
            echo "Skipping admin bootstrap SQL generation; admin credentials were not provided."
          fi
      - name: Ensure admin user (optional)
        if: hashFiles('.tmp/edgechat-admin-upsert.sql') != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute ${{ steps.ensure_resources.outputs.d1_database_name }} --remote --file .tmp/edgechat-admin-upsert.sql --config wrangler.ci.toml
      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.ci.toml
